<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyMusic - شغال بجد</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0f0f1a;color:#fff;padding:16px}
h1{text-align:center}h1 span{color:#a855f7}
.tabs{display:flex;gap:8px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.tabs button{padding:10px 16px;border:0;border-radius:20px;background:#222; color:#fff;cursor:pointer}
.tabs button.active{background:#a855f7}
.search{display:flex;gap:8px;max-width:600px;margin:auto}
input{flex:1;padding:12px;border-radius:12px;border:0;background:#1e1e2e;color:#fff;outline:none}
.btn{padding:12px 18px;border:0;border-radius:12px;background:#a855f7;color:#fff;cursor:pointer;font-weight:bold}
.card{background:#1e1e2e;border-radius:16px;padding:12px;margin:12px auto;max-width:600px;display:flex;gap:12px;align-items:center}
.card img{width:70px;height:70px;border-radius:12px}
.card h3{margin:0;font-size:16px}.card p{margin:4px 0;color:#aaa;font-size:13px}
.card .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.card .actions button{padding:6px 10px;border:0;border-radius:8px;cursor:pointer;background:#333;color:#fff}
.card .actions .play{background:#22c55e}.card .actions .save{background:#eab308;color:#000}
.box{max-width:600px;margin:16px auto;background:#1e1e2e;padding:16px;border-radius:16px}
audio{width:100%;margin-top:10px}
#result{white-space:pre-wrap;background:#111;padding:12px;border-radius:12px;margin-top:10px}
.hidden{display:none}
</style>
</head>
<body>
<h1>🎵 My<span>Music</span></h1>
<div class="tabs">
<button class="active" onclick="show('searchTab',this)">🔍 بحث</button>
<button onclick="show('transTab',this)">🎬 ترجمة فيديو</button>
<button onclick="show('savedTab',this)">💾 المحفوظ</button>
</div>

<div id="searchTab">
<div class="search">
<input id="q" placeholder="اكتب اسم اغنية... مثال: Training Season" onkeydown="if(event.key==='Enter')search()">
<button class="btn" onclick="search()">ابحث</button>
</div>
<div id="list"></div>
<audio id="player" controls style="max-width:600px;display:block;margin:16px auto"></audio>
</div>

<div id="transTab" class="hidden">
<div class="box">
<h3>🎬 ترجمة فيديو</h3>
<input id="yt" placeholder="الصق لينك يوتيوب هنا" style="width:100%;margin-bottom:10px">
<input id="txt" placeholder="اكتب عنوان الفيديو بالانجليزي عشان نترجمه" style="width:100%;margin-bottom:10px">
<button class="btn" onclick="translateNow()" style="width:100%">ترجم للعربي</button>
<div id="result">النتيجة هتظهر هنا...</div>
<button class="btn" onclick="saveTrans()" style="width:100%;margin-top:10px;background:#eab308;color:#000">💾 حفظ الترجمة</button>
</div>
</div>

<div id="savedTab" class="hidden">
<div id="savedList"></div>
</div>

<script>
let saved = JSON.parse(localStorage.getItem('mymusic_saved')||'[]');
function show(id,btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');['searchTab','transTab','savedTab'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='savedTab')renderSaved();}
async function search(){
let q=document.getElementById('q').value.trim();if(!q)return alert('اكتب اسم اغنية الاول');
document.getElementById('list').innerHTML='⏳ جاري البحث...';
try{
let r=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(q)+'&media=music&limit=20&country=EG');
let d=await r.json();
if(!d.results.length){document.getElementById('list').innerHTML='مفيش نتائج';return;}
document.getElementById('list').innerHTML=d.results.map((s,i)=>`
<div class="card"><img src="${s.artworkUrl100}"><div style="flex:1"><h3>${s.trackName}</h3><p>${s.artistName} - ${s.collectionName||''}</p><div class="actions"><button class="play" onclick="playSong('${s.previewUrl}')">▶ تشغيل</button><button class="save" onclick="saveSong(${i})">💾 حفظ</button><a href="${s.previewUrl}" download><button>⬇ تحميل</button></a><button onclick="translateSong('${s.trackName}')">🌐 ترجم الاسم</button></div></div></div>`).join('');
window._results=d.results;
}catch(e){document.getElementById('list').innerHTML='حصل مشكلة في الاتصال، جرب تاني';}
}
function playSong(url){let p=document.getElementById('player');p.src=url;p.play();p.scrollIntoView({behavior:'smooth'});}
function saveSong(i){let s=window._results[i];if(!saved.find(x=>x.trackId===s.trackId)){saved.push(s);localStorage.setItem('mymusic_saved',JSON.stringify(saved));alert('اتحفظت ✅');}else alert('محفوظة قبل كده');}
function renderSaved(){let el=document.getElementById('savedList');if(!saved.length){el.innerHTML='<p style="text-align:center">لسه مفيش محفوظ</p>';return;}el.innerHTML=saved.map((s,i)=>`<div class="card"><img src="${s.artworkUrl100}"><div style="flex:1"><h3>${s.trackName}</h3><p>${s.artistName}</p><div class="actions"><button class="play" onclick="playSong('${s.previewUrl}')">▶ تشغيل</button><button onclick="removeSaved(${i})">🗑 حذف</button></div></div></div>`).join('');}
function removeSaved(i){saved.splice(i,1);localStorage.setItem('mymusic_saved',JSON.stringify(saved));renderSaved();}
async function translateNow(){let t=document.getElementById('txt').value.trim();if(!t)return alert('اكتب عنوان الفيديو الاول');document.getElementById('result').textContent='⏳ جاري الترجمة...';let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(t)+'&langpair=en|ar');let d=await r.json();document.getElementById('result').textContent=d.responseData.translatedText;}
async function translateSong(name){let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(name)+'&langpair=en|ar');let d=await r.json();alert(name+'\nيعني بالعربي: '+d.responseData.translatedText);}
function saveTrans(){let t=document.getElementById('result').textContent;localStorage.setItem('last_trans',t);alert('اتحفظت ✅: '+t);}
</script>
</body>
  </html>
