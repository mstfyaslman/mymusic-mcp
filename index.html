<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyMusic 🎧 اسمع وحمل أغاني مجاناً - كل الفنانين</title>
<meta name="description" content="MyMusic - اسمع وحمل أغاني مجاناً، عمرو دياب، شيرين، ويجز، دوا ليبا، شاكيرا، كلمات وترجمة وقوائم تشغيل">
<meta property="og:title" content="MyMusic 🎧 اسمع أغاني مجاناً">
<meta property="og:description" content="كل الفنانين - كلمات وترجمة - قوائم تشغيل - تحميل MP3">
<meta property="og:type" content="website">
<style>
 *{box-sizing:border-box} body{margin:0;font-family:sans-serif;background:#0a0a0a;color:#fff;text-align:center;padding-bottom:130px}
 .hero{background:linear-gradient(180deg,#ff0000,#7a0000 45%,#000);padding:20px 15px 28px;border-bottom-left-radius:35px;border-bottom-right-radius:35px}
 .logo{font-size:42px;font-weight:900} .logo span{background:#000;padding:2px 10px;border-radius:12px}
 .headphones{font-size:80px}
 .badge{background:#22c55e;color:#000;font-size:12px;padding:5px 12px;border-radius:20px;font-weight:bold}
 .tabs{display:flex;gap:8px;justify-content:center;margin:12px;flex-wrap:wrap} .tabs button{padding:10px 14px;border-radius:20px;border:none;background:#222;color:#fff;cursor:pointer} .tabs button.active{background:#ff0000}
 .box{margin:10px 15px;background:#1a1a1a;padding:14px;border-radius:20px;border:1px solid #333}
 input{width:100%;padding:12px;border-radius:25px;border:none;outline:none;text-align:center;background:#000;color:#fff;font-size:16px;margin:4px 0}
 .btn{width:100%;padding:12px;border:none;border-radius:25px;background:#ff0000;color:#fff;font-weight:bold;margin-top:8px;cursor:pointer}
 .artist{display:inline-block;width:82px;margin:6px;cursor:pointer;vertical-align:top} .artist div{width:64px;height:64px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-size:28px;margin:auto} .artist span{font-size:12px;display:block;margin-top:4px;line-height:1.3}
 .card{background:#1a1a1a;border:1px solid #2a2a2a;padding:12px;border-radius:18px;margin:10px 15px;text-align:right}
 .card img{width:60px;height:60px;border-radius:12px;float:left;object-fit:cover}
 .small{padding:9px 12px;border-radius:15px;border:none;margin:4px;cursor:pointer;color:#fff;font-size:14px}
 .lyrics{white-space:pre-line;background:#000;padding:12px;border-radius:12px;font-size:14px;line-height:1.8;text-align:left;direction:ltr;max-height:300px;overflow:auto;margin-top:8px}
 iframe{width:100%;height:220px;border-radius:12px;margin-top:8px;border:none}
 .ytbox{background:#000;padding:10px;border-radius:15px;margin:10px 15px}
 .filterBtn{padding:8px 14px;border-radius:20px;border:none;background:#333;color:#fff;margin:3px;cursor:pointer} .filterBtn.active{background:#ff0000}
 #player{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:2px solid #ff0000;padding:10px 12px;z-index:99;display:none}
 #player .row{display:flex;align-items:center;gap:10px;text-align:right}
 #player img{width:55px;height:55px;border-radius:10px;object-fit:cover}
 #player .info{flex:1;overflow:hidden} #player .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} #player .info small{color:#aaa}
 #player .controls{display:flex;justify-content:center;gap:12px;margin-top:8px;align-items:center}
 #player .controls button{width:48px;height:48px;border-radius:50%;border:none;background:#ff0000;color:#fff;font-size:20px;cursor:pointer}
 #player .controls button.mini{width:38px;height:38px;background:#333;font-size:16px}
 #progress{width:100%;accent-color:#ff0000;margin-top:6px} #time{font-size:11px;color:#aaa;display:flex;justify-content:space-between}
 .playlistCard{background:#222;border:1px solid #333;padding:12px;border-radius:15px;margin:10px 0;text-align:right}
 .shareBox{background:linear-gradient(90deg,#25D366,#128C7E);padding:15px;border-radius:20px;margin:10px 15px}
</style>
</head>
<body>

<div class="hero">
 <div class="headphones">🎧</div>
 <div class="logo">My<span>Music</span></div>
 <div>اسمع • حمل • كلمات • ترجمة • قوائم تشغيل</div><br>
 <span class="badge">✅ مجاني 100% • +100 فنان • أغاني كاملة</span>
</div>

<div class="tabs">
 <button id="tab-search" class="active" onclick="showTab('search')">🔍 بحث</button>
 <button id="tab-artists" onclick="showTab('artists')">🌍 الفنانين</button>
 <button id="tab-playlists" onclick="showTab('playlists')">🎼 قوائمي</button>
 <button id="tab-fav" onclick="showTab('fav')">❤️ المفضلة <span id="favCount"></span></button>
</div>

<div id="view-search">
 <div class="box"><input id="search" placeholder="ابحث عن أغنية أو فنان..."><button class="btn" onclick="searchMusic()">🔍 بحث الآن</button></div>
 <div id="results"><p style="color:#aaa">اكتب اسم أغنية ودوس بحث</p></div>
</div>

<div id="view-artists" style="display:none">
 <div class="box">
  <input id="artistSearch" placeholder="🔍 دور على فنان..." oninput="renderArtistList()">
  <br><br>
  <button class="filterBtn active" onclick="filterCat('all',this)">الكل</button>
  <button class="filterBtn" onclick="filterCat('eg',this)">🇪🇬 مصر</button>
  <button class="filterBtn" onclick="filterCat('arab',this)">🌍 عرب</button>
  <button class="filterBtn" onclick="filterCat('world',this)">🌎 أجانب</button>
  <button class="filterBtn" onclick="filterCat('rap',this)">🎤 راب</button>
  <button class="filterBtn" onclick="filterCat('latin',this)">💃 لاتيني</button>
 </div>
 <div id="artistList"></div><div id="artistResults"></div>
</div>

<div id="view-playlists" style="display:none">
 <div class="box"><h3>🎼 إنشاء قائمة تشغيل</h3><input id="newPlaylistName" placeholder="اسم القايمة... مثال: أغاني السفر"><button class="btn" onclick="createPlaylist()">➕ إنشاء قايمة</button></div>
 <div id="playlistsList" style="padding:0 15px"></div>
</div>

<div id="view-fav" style="display:none"><div id="favList"></div></div>

<div class="shareBox">
 <h3 style="margin:0">📣 شير الموقع لصحابك</h3>
 <p style="font-size:13px">كل شير بيخلي الموقع يكبر</p>
 <button class="small" style="background:#fff;color:#000;font-weight:bold;width:100%" onclick="shareSite()">💬 شير على واتساب</button>
 <button class="small" style="background:#000;width:100%" onclick="navigator.clipboard.writeText(location.href);alert('اتنسخ اللينك ✅')">🔗 انسخ اللينك</button>
</div>

<div id="ytPlayer" style="display:none" class="ytbox">
 <h3 id="ytTitle">▶️ تشغيل من YouTube</h3>
 <iframe id="ytFrame" allow="autoplay; encrypted-media" allowfullscreen></iframe>
 <button class="small" style="background:#333" onclick="closeYT()">✖️ إغلاق</button>
</div>

<div id="player">
 <div class="row">
  <img id="pImg" src="https://cdn-icons-png.flaticon.com/512/727/727269.png">
  <div class="info"><b id="pTitle">لا توجد أغنية</b><small id="pArtist">اختر أغنية لتشغيلها</small></div>
  <button class="small" style="background:#333" onclick="closePlayer()">✖️</button>
 </div>
 <input type="range" id="progress" value="0" min="0" max="100" oninput="seek(this.value)">
 <div id="time"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
 <div class="controls">
  <button class="mini" onclick="prevSong()">⏮️</button>
  <button onclick="togglePlay()" id="playBtn">▶️</button>
  <button class="mini" onclick="nextSong()">⏭️</button>
  <button class="mini" onclick="toggleLoop()" id="loopBtn">🔁</button>
 </div>
 <audio id="mainAudio" preload="auto"></audio>
</div>

<script>
const API='https://discoveryprovider.audius.co/v1';
let ALL=[
 {n:"Amr Diab",ar:"عمرو دياب",e:"🇪🇬",c:"eg"},{n:"Umm Kulthum",ar:"أم كلثوم",e:"👑",c:"eg"},{n:"Tamer Hosny",ar:"تامر حسني",e:"🎙️",c:"eg"},
 {n:"Sherine",ar:"شيرين",e:"🎵",c:"eg"},{n:"Mohamed Hamaki",ar:"محمد حماقي",e:"🔥",c:"eg"},{n:"Wegz",ar:"ويجز",e:"🎧",c:"rap"},
 {n:"Ahmed Saad",ar:"أحمد سعد",e:"🎶",c:"eg"},{n:"Elissa",ar:"إليسا",e:"💎",c:"arab"},{n:"Nancy Ajram",ar:"نانسي عجرم",e:"🌹",c:"arab"},
 {n:"Wael Kfoury",ar:"وائل كفوري",e:"🎸",c:"arab"},{n:"Kadim Al Sahir",ar:"كاظم الساهر",e:"🎼",c:"arab"},{n:"Hussain Al Jassmi",ar:"حسين الجسمي",e:"🎵",c:"arab"},
 {n:"Saad Lamjarred",ar:"سعد لمجرد",e:"🔥",c:"arab"},{n:"Dua Lipa",ar:"دوا ليبا",e:"💃",c:"world"},{n:"Shakira",ar:"شاكيرا",e:"💃",c:"latin"},
 {n:"Taylor Swift",ar:"تايلور سويفت",e:"⭐",c:"world"},{n:"Ed Sheeran",ar:"إد شيران",e:"🎸",c:"world"},{n:"Adele",ar:"أديل",e:"💜",c:"world"},
 {n:"BTS",ar:"بي تي اس",e:"💜",c:"world"},{n:"Billie Eilish",ar:"بيلي إيليش",e:"🌙",c:"world"},{n:"The Weeknd",ar:"ذا ويكند",e:"🌃",c:"world"},
 {n:"Eminem",ar:"إمينيم",e:"🎤",c:"rap"},{n:"Drake",ar:"دريك",e:"🔥",c:"rap"},{n:"Bad Bunny",ar:"باد باني",e:"🐰",c:"latin"},
 {n:"Maluma",ar:"مالوما",e:"💃",c:"latin"},{n:"BLACKPINK",ar:"بلاك بينك",e:"🖤",c:"world"}
];
let currentCat='all';
let favs=JSON.parse(localStorage.getItem('mymusic_fav')||'[]');
let playlists=JSON.parse(localStorage.getItem('mymusic_playlists')||'[]');
let currentQueue=[]; let currentIndex=0;
let audio=document.getElementById('mainAudio'); let isLoop=false;
function updateFavCount(){document.getElementById('favCount').innerText=favs.length?`(${favs.length})`:''}
updateFavCount();
function renderArtistList(){
 let q=(document.getElementById('artistSearch').value||'').toLowerCase();
 let list=ALL.filter(a=>(currentCat=='all'||a.c==currentCat)&&(a.ar.includes(q)||a.n.toLowerCase().includes(q)||q==''));
 document.getElementById('artistList').innerHTML=`<p style="color:#aaa">عرض ${list.length} فنان</p>`+list.map(a=>`<div class="artist" onclick="loadArtist('${a.n}')"><div>${a.e}</div><span>${a.ar}</span></div>`).join('');
}
function filterCat(cat,btn){currentCat=cat;document.querySelectorAll('.filterBtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderArtistList();}
renderArtistList();
function showTab(t){
 ['search','artists','playlists','fav'].forEach(x=>{
  document.getElementById('view-'+x).style.display=x==t?'block':'none';
  document.getElementById('tab-'+x).classList.toggle('active',x==t);
 });
 if(t=='fav') renderFav(); if(t=='playlists') renderPlaylists();
}
function shareSite(){let txt='اسمع وحمل أغاني مجاناً 🎧🔥 MyMusic - كل الفنانين، كلمات وترجمة، وقوائم تشغيل 👇 '+location.href; window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');}
function playSong(song,queue){
 if(queue){currentQueue=queue;currentIndex=queue.findIndex(s=>s.audio==song.audio);} else {currentQueue=[song];currentIndex=0;}
 audio.pause(); audio.currentTime=0; audio.src=song.audio;
 document.getElementById('player').style.display='block';
 document.getElementById('pImg').src=song.image||'https://cdn-icons-png.flaticon.com/512/727/727269.png';
 document.getElementById('pTitle').innerText=song.name; document.getElementById('pArtist').innerText=song.artist_name;
 audio.play(); document.getElementById('playBtn').innerText='⏸️';
}
function togglePlay(){if(!audio.src) return alert('اختر أغنية الأول'); if(audio.paused){audio.play();document.getElementById('playBtn').innerText='⏸️';}else{audio.pause();document.getElementById('playBtn').innerText='▶️';}}
function nextSong(){if(!currentQueue.length) return; currentIndex=(currentIndex+1)%currentQueue.length; playSong(currentQueue[currentIndex],currentQueue);}
function prevSong(){if(!currentQueue.length) return; currentIndex=(currentIndex-1+currentQueue.length)%currentQueue.length; playSong(currentQueue[currentIndex],currentQueue);}
function toggleLoop(){isLoop=!isLoop;audio.loop=isLoop;document.getElementById('loopBtn').style.background=isLoop?'#ff0000':'#333';}
function closePlayer(){audio.pause();audio.src='';document.getElementById('player').style.display='none';}
function seek(v){if(audio.duration) audio.currentTime=(v/100)*audio.duration;}
function fmt(s){if(!s||isNaN(s)) return '0:00'; let m=Math.floor(s/60); let sec=Math.floor(s%60); return m+':'+String(sec).padStart(2,'0');}
audio.addEventListener('timeupdate',()=>{if(audio.duration){document.getElementById('progress').value=(audio.currentTime/audio.duration)*100;document.getElementById('curTime').innerText=fmt(audio.currentTime);document.getElementById('durTime').innerText=fmt(audio.duration);}});
audio.addEventListener('ended',()=>{if(!isLoop) nextSong();});
function createPlaylist(){let name=document.getElementById('newPlaylistName').value.trim(); if(!name) return alert('اكتب اسم القايمة'); playlists.push({id:Date.now(),name,songs:[]}); localStorage.setItem('mymusic_playlists',JSON.stringify(playlists)); document.getElementById('newPlaylistName').value=''; renderPlaylists(); alert('اتعملت القايمة ✅');}
function renderPlaylists(){
 let box=document.getElementById('playlistsList');
 if(!playlists.length){box.innerHTML='<p style="color:#aaa">لسه مفيش قوائم، اعمل قايمة جديدة فوق</p>';return;}
 box.innerHTML=playlists.map((p,i)=>`<div class="playlistCard"><b>🎼 ${p.name}</b> <small>(${p.songs.length} أغنية)</small><br><button class="small" style="background:#ff0000" onclick="playPlaylist(${i})">▶️ تشغيل القايمة كلها</button><button class="small" style="background:#333" onclick="deletePlaylist(${i})">🗑️ حذف</button><div>${p.songs.map((s,si)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid #333"><span>🎵 ${s.name}</span><button class="small" style="background:#333" onclick="removeFromPlaylist(${i},${si})">✖️</button></div>`).join('')||'<small>القايمة فاضية</small>'}</div></div>`).join('');
}
function deletePlaylist(i){if(confirm('تحذف القايمة؟')){playlists.splice(i,1);localStorage.setItem('mymusic_playlists',JSON.stringify(playlists));renderPlaylists();}}
function removeFromPlaylist(pi,si){playlists[pi].songs.splice(si,1);localStorage.setItem('mymusic_playlists',JSON.stringify(playlists));renderPlaylists();}
function addToPlaylist(song){if(!playlists.length) return alert('اعمل قايمة الأول من تبويب 🎼 قوائمي'); let names=playlists.map((p,i)=>`${i+1}. ${p.name}`).join('\n'); let choice=prompt('اختار رقم القايمة:\n'+names); let idx=parseInt(choice)-1; if(playlists[idx]){playlists[idx].songs.push(song);localStorage.setItem('mymusic_playlists',JSON.stringify(playlists));alert('اتضافت لقايمة '+playlists[idx].name+' ✅');}}
function playPlaylist(i){if(!playlists[i].songs.length) return alert('القايمة فاضية'); playSong(playlists[i].songs[0],playlists[i].songs);}
function cardHTML(tr,queue){
 let img=tr.artwork?tr.artwork['480x480']||tr.artwork['150x150']:'https://cdn-icons-png.flaticon.com/512/727/727269.png';
 let stream=`https://discoveryprovider.audius.co/v1/tracks/${tr.id}/stream?app_name=MyMusic`;
 let t={name:tr.title,artist_name:tr.user?tr.user.name:'',audio:stream,image:img};
 return `<div class="card"><img src="${img}"><b>${t.name}</b><br><small>${t.artist_name}</small><div style="clear:both"></div>
 <button class="small" style="background:#ff0000;width:100%" onclick='playSong(${JSON.stringify(t).replace(/'/g,"\\'")},${JSON.stringify(queue||[t]).replace(/'/g,"\\'")})'>▶️ تشغيل</button>
 <button class="small" style="background:#ff0000" onclick="playYT('${t.artist_name.replace(/'/g,'')}','${t.name.replace(/'/g,'')}')">▶️ YouTube</button>
 <button class="small" style="background:#a855f7" onclick="showLyrics('${t.artist_name.replace(/'/g,'')}','${t.name.replace(/'/g,'')}',this)">📝 كلمات</button>
 <button class="small" style="background:#ff0055" onclick='toggleFav(${JSON.stringify(t).replace(/'/g,"\\'")},this)'>❤️ مفضلة</button>
 <button class="small" style="background:#ff9800" onclick='addToPlaylist(${JSON.stringify(t).replace(/'/g,"\\'")})'>➕ قايمة</button>
 <a href="${stream}" download target="_blank"><button class="small" style="background:#22c55e">⬇️ MP3</button></a>
 <div class="lyricsBox"></div></div>`;
}
function cardItunes(s,queue){
 let t={name:s.trackName,artist_name:s.artistName,audio:s.previewUrl,image:s.artworkUrl100};
 return `<div class="card"><img src="${t.image}"><b>${t.name}</b><br><small>${t.artist_name}</small><div style="clear:both"></div>
 <button class="small" style="background:#ff0000;width:100%" onclick='playSong(${JSON.stringify(t).replace(/'/g,"\\'")},${JSON.stringify(queue||[t]).replace(/'/g,"\\'")})'>▶️ تشغيل</button>
 <button class="small" style="background:#ff0000" onclick="playYT('${t.artist_name.replace(/'/g,'')}','${t.name.replace(/'/g,'')}')">▶️ YouTube كامل</button>
 <button class="small" style="background:#a855f7" onclick="showLyrics('${t.artist_name.replace(/'/g,'')}','${t.name.replace(/'/g,'')}',this)">📝 كلمات</button>
 <button class="small" style="background:#ff9800" onclick='addToPlaylist(${JSON.stringify(t).replace(/'/g,"\\'")})'>➕ قايمة</button>
 <div class="lyricsBox"></div></div>`;
}
async function searchMusic(){
 let q=document.getElementById('search').value.trim(); if(!q) return alert('اكتب اسم أغنية');
 document.getElementById('results').innerHTML='⏳ جاري البحث...';
 let r1=await fetch(`${API}/tracks/search?query=${encodeURIComponent(q)}&app_name=MyMusic`);
 let d1=await r1.json();
 if(d1.data && d1.data.length){let queue=d1.data.map(tr=>({name:tr.title,artist_name:tr.user?tr.user.name:'',audio:`https://discoveryprovider.audius.co/v1/tracks/${tr.id}/stream?app_name=MyMusic`,image:tr.artwork?tr.artwork['480x480']:''})); document.getElementById('results').innerHTML=d1.data.map(tr=>cardHTML(tr,queue)).join(''); return;}
 let r2=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=music&limit=20&country=EG`);
 let d2=await r2.json(); let q2=d2.results.map(s=>({name:s.trackName,artist_name:s.artistName,audio:s.previewUrl,image:s.artworkUrl100}));
 document.getElementById('results').innerHTML=d2.results.map(s=>cardItunes(s,q2)).join('');
}
async function loadArtist(name){
 document.getElementById('artistResults').innerHTML='⏳ جاري تحميل أغاني '+name+'...';
 let r1=await fetch(`${API}/tracks/search?query=${encodeURIComponent(name)}&app_name=MyMusic`);
 let d1=await r1.json();
 if(d1.data && d1.data.length){let queue=d1.data.map(tr=>({name:tr.title,artist_name:tr.user?tr.user.name:'',audio:`https://discoveryprovider.audius.co/v1/tracks/${tr.id}/stream?app_name=MyMusic`,image:tr.artwork?tr.artwork['480x480']:''})); document.getElementById('artistResults').innerHTML=`<h3>أغاني ${name}</h3>`+d1.data.map(tr=>cardHTML(tr,queue)).join(''); return;}
 let r2=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(name)}&media=music&limit=20&country=EG`);
 let d2=await r2.json(); let q2=d2.results.map(s=>({name:s.trackName,artist_name:s.artistName,audio:s.previewUrl,image:s.artworkUrl100}));
 document.getElementById('artistResults').innerHTML=`<h3>أغاني ${name}</h3>`+d2.results.map(s=>cardItunes(s,q2)).join('');
}
function playYT(artist,title){closePlayer();document.getElementById('ytPlayer').style.display='block';document.getElementById('ytTitle').innerText='▶️ '+artist+' - '+title;document.getElementById('ytFrame').src=`https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(artist+' '+title)}&autoplay=1`;document.getElementById('ytPlayer').scrollIntoView({behavior:'smooth'});}
function closeYT(){document.getElementById('ytPlayer').style.display='none';document.getElementById('ytFrame').src='';}
function toggleFav(t,btn){let idx=favs.findIndex(f=>f.audio==t.audio); if(idx>-1){favs.splice(idx,1)}else{favs.push(t);alert('اتضافت للمفضلة ❤️')} localStorage.setItem('mymusic_fav',JSON.stringify(favs)); updateFavCount();}
function renderFav(){if(!favs.length){document.getElementById('favList').innerHTML='<p style="color:#aaa">لسه مفيش مفضلة</p>';return;} document.getElementById('favList').innerHTML=favs.map(t=>`<div class="card"><img src="${t.image}"><b>${t.name}</b><br><small>${t.artist_name}</small><div style="clear:both"></div><button class="small" style="background:#ff0000;width:100%" onclick='playSong(${JSON.stringify(t).replace(/'/g,"\\'")},${JSON.stringify(favs).replace(/'/g,"\\'")})'>▶️ تشغيل</button></div>`).join('');}
async function showLyrics(artist,title,btn){
 let box=btn.parentElement.querySelector('.lyricsBox'); box.innerHTML='⏳ جاري جلب الكلمات...';
 try{let r=await fetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`); let d=await r.json(); if(!d.lyrics){box.innerHTML='<div class="lyrics">الكلمات مش متاحة.</div>';return;} let lyrics=d.lyrics.slice(0,2000); box.innerHTML=`<div class="lyrics">${lyrics}</div><button class="small" style="background:#ff9800" onclick="translateLyrics(this)">🌐 ترجم</button><div class="transBox"></div>`; box.dataset.lyrics=lyrics;}catch(e){box.innerHTML='مش قادر أجيب الكلمات'}
}
async function translateLyrics(btn){
 let box=btn.parentElement; let text=box.parentElement.dataset.lyrics||''; let tb=box.querySelector('.transBox'); tb.innerHTML='⏳ جاري الترجمة...';
 try{let r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.slice(0,500))}&langpair=en|ar`); let d=await r.json(); tb.innerHTML=`<div class="lyrics" style="direction:rtl;text-align:right">${d.responseData.translatedText}</div>`;}catch(e){tb.innerHTML='الترجمة مش شغالة'}
}
document.getElementById('search').addEventListener('keypress',e=>{if(e.key=='Enter')searchMusic()});
</script>
