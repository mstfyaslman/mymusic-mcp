<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyMusic - تحميل</title>
<style>
 body{font-family:sans-serif;background:#111;color:#fff;text-align:center;padding:20px}
 h1{color:#a855f7} h1 span{color:#ec4899}
 input{width:90%;max-width:460px;padding:13px;border-radius:20px;border:none;outline:none;font-size:15px;text-align:center;margin:5px}
 button{padding:12px 18px;border:none;border-radius:20px;background:#a855f7;color:#fff;font-size:15px;margin:4px;cursor:pointer}
 .box{background:#222;padding:18px;border-radius:15px;margin:15px auto;max-width:500px}
 .note{background:#2a1a3a;border:1px solid #a855f7;padding:12px;border-radius:12px;max-width:500px;margin:10px auto;font-size:14px;line-height:1.7}
 audio,video{width:100%;margin-top:10px}
</style>
</head>
<body>

<h1>My<span>Music</span> 🎵</h1>
<p>مركز التحميل - زي SnapTube بس للمحتوى المجاني والقانوني</p>

<div class="note">
⚠️ تحميل أغاني YouTube المحمية بحقوق النشر ممنوع وهيقفل موقعك.
هنا تقدر تحمل أي ملف MP3 / MP4 برابط مباشر، أو موسيقى مجانية من Jamendo و Pixabay.
</div>

<div class="box">
<h3>🔗 1 - تحميل برابط مباشر</h3>
<input id="link" placeholder="الصق رابط MP3 أو MP4 هنا...">
<br>
<button onclick="loadLink()">👁️ عرض وتشغيل</button>
<button onclick="downloadLink()" style="background:#22c55e">⬇️ تحميل</button>
<div id="preview"></div>
</div>

<div class="box">
<h3>🔍 2 - بحث في الموسيقى المجانية</h3>
<input id="search" placeholder="اكتب اسم أغنية مجانية...">
<br>
<button onclick="searchFree()">🔍 بحث</button>
<div id="results"></div>
</div>

<script>
function loadLink(){
  let url = document.getElementById('link').value.trim();
  if(!url) return alert('الصق رابط الأول');
  let isVideo = url.includes('.mp4') || url.includes('.webm');
  document.getElementById('preview').innerHTML = isVideo ?
    `<video controls src="${url}"></video>` :
    `<audio controls src="${url}"></audio><p>اضغط تحميل لحفظ الملف</p>`;
}
function downloadLink(){
  let url = document.getElementById('link').value.trim();
  if(!url) return alert('الصق رابط الأول');
  let a = document.createElement('a');
  a.href = url; a.download = ''; a.target = '_blank';
  document.body.appendChild(a); a.click(); a.remove();
}
async function searchFree(){
  let q = document.getElementById('search').value;
  if(!q) return alert('اكتب اسم أغنية');
  document.getElementById('results').innerHTML = 'جاري البحث...';
  // Jamendo - موسيقى مجانية مرخصة
  let res = await fetch(`https://api.jamendo.com/v3.0/tracks/?client_id=9f2d5c3a&format=json&limit=10&search=${encodeURIComponent(q)}`);
  let data = await res.json();
  let html = '';
  data.results.forEach(t => {
    html += `<div style="border-top:1px solid #444;padding:10px">
      <b>${t.name}</b><br><small>${t.artist_name}</small><br>
      <audio controls src="${t.audio}"></audio><br>
      <a href="${t.audio}" download><button style="background:#22c55e">⬇️ تحميل MP3 كامل</button></a>
    </div>`;
  });
  document.getElementById('results').innerHTML = html || 'مفيش نتائج، جرب كلمة انجليزية';
}
</script>
</body>
</html>
