<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyMusic</title>
<style>
 *{box-sizing:border-box} body{margin:0;font-family:sans-serif;background:#0a0a0a;color:#fff;text-align:center}
 .hero{background:linear-gradient(180deg,#ff0000,#7a0000 45%,#000);padding:20px 15px 30px;border-bottom-left-radius:35px;border-bottom-right-radius:35px}
 .logo{font-size:42px;font-weight:900} .logo span{background:#000;padding:2px 10px;border-radius:12px}
 .headphones{font-size:85px}
 .tabs{display:flex;gap:8px;justify-content:center;margin:12px} .tabs button{padding:10px 16px;border-radius:20px;border:none;background:#222;color:#fff;cursor:pointer} .tabs button.active{background:#ff0000}
 .box{margin:10px 15px;background:#1a1a1a;padding:14px;border-radius:20px;border:1px solid #333}
 input{width:100%;padding:12px;border-radius:25px;border:none;outline:none;text-align:center;background:#000;color:#fff;font-size:16px}
 .btn{width:100%;padding:12px;border:none;border-radius:25px;background:#ff0000;color:#fff;font-weight:bold;margin-top:10px;cursor:pointer}
 .artist{display:inline-block;width:80px;margin:6px;cursor:pointer} .artist div{width:70px;height:70px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-size:32px;margin:auto} .artist span{font-size:12px}
 .card{background:#1a1a1a;border:1px solid #2a2a2a;padding:12px;border-radius:18px;margin:10px 15px;text-align:right}
 .card img{width:60px;height:60px;border-radius:12px;float:left;object-fit:cover}
 audio{width:100%;margin-top:8px} .small{padding:8px 12px;border-radius:15px;border:none;margin:4px;cursor:pointer;color:#fff}
 .lyrics{white-space:pre-line;background:#000;padding:12px;border-radius:12px;font-size:14px;line-height:1.8;text-align:left;direction:ltr;max-height:300px;overflow:auto;margin-top:8px}
</style>
</head>
<body>

<div class="hero">
 <div class="headphones">🎧</div>
 <div class="logo">My<span>Music</span></div>
 <div>كلمات • ترجمة • فنانين العالم • مفضلة • تحميل MP3</div>
</div>

<div class="tabs">
 <button id="tab-search" class="active" onclick="showTab('search')">🔍 بحث</button>
 <button id="tab-artists" onclick="showTab('artists')">🌍 الفنانين</button>
 <button id="tab-fav" onclick="showTab('fav')">❤️ المفضلة <span id="favCount"></span></button>
</div>

<div id="view-search">
 <div class="box">
  <input id="search" placeholder="اكتب اسم أغنية... مثال: happy">
  <button class="btn" onclick="searchMusic()">🔍 بحث</button>
 </div>
 <div id="results"><p style="color:#aaa">اكتب اسم أغنية ودوس بحث</p></div>
</div>

<div id="view-artists" style="display:none">
 <div class="box"><h3>🌍 فنانين من كل العالم - دوس على أي فنان</h3><div id="artistList"></div></div>
 <div id="artistResults"></div>
</div>

<div id="view-fav" style="display:none"><div id="favList"><p style="color:#aaa">لسه مفيش مفضلة، دوس ❤️ على أي أغنية</p></div></div>

<script>
let artists=[
 {n:"عمرو دياب",e:"🎤"},{n:"أم كلثوم",e:"👑"},{n:"تامر حسني",e:"🎙️"},{n:"شيرين",e:"🎵"},
 {n:"Taylor Swift",e:"⭐"},{n:"Ed Sheeran",e:"🎸"},{n:"Adele",e:"💜"},{n:"BTS",e:"💜"},
 {n:"Drake",e:"🔥"},{n:"Billie Eilish",e:"🌙"},{n:"The Weeknd",e:"🌃"},{n:"Coldplay",e:"🌈"},
 {n:"Amr Diab",e:"🇪🇬"},{n:"Elissa",e:"💎"},{n:"Nancy Ajram",e:"🌹"},{n:"Saad Lamjarred",e:"🎶"}
];
let favs = JSON.parse(localStorage.getItem('mymusic_fav')||'[]');
function updateFavCount(){document.getElementById('favCount').innerText = favs.length?`(${favs.length})`:''}
updateFavCount();
document.getElementById('artistList').innerHTML = artists.map((a,i)=>`<div class="artist" onclick="loadArtist('${a.n}')"><div>${a.e}</div><span>${a.n}</span></div>`).join('');

function showTab(t){
 ['search','artists','fav'].forEach(x=>{
   document.getElementById('view-'+x).style.display = x==t?'block':'none';
   document.getElementById('tab-'+x).classList.toggle('active', x==t);
 });
 if(t=='fav') renderFav();
}
function cardHTML(t){
 let isFav = favs.some(f=>f.audio==t.audio);
 return `<div class="card">
  <img src="${t.image||'https://cdn-icons-png.flaticon.com/512/727/727269.png'}">
  <b>${t.name}</b><br><small>${t.artist_name}</small>
  <div style="clear:both"></div>
  <audio controls preload="none" src="${t.audio}"></audio><br>
  <button class="small" style="background:#a855f7" onclick="showLyrics('${t.artist_name.replace(/'/g,'')}','${t.name.replace(/'/g,'')}',this)">📝 كلمات + ترجمة</button>
  <button class="small" style="background:#ff0055" onclick='toggleFav(${JSON.stringify(t).replace(/'/g,"\\'")},this)'>${isFav?'💔 إزالة':'❤️ مفضلة'}</button>
  <a href="${t.audio}" download target="_blank"><button class="small" style="background:#22c55e">⬇️ تحميل MP3</button></a>
  <div class="lyricsBox"></div>
 </div>`;
}
async function searchMusic(){
 let q=document.getElementById('search').value.trim(); if(!q) return alert('اكتب اسم أغنية');
 document.getElementById('results').innerHTML='⏳ جاري البحث...';
 let res=await fetch(`https://api.jamendo.com/v3.0/tracks/?client_id=9f2d5c3a&format=json&limit=20&search=${encodeURIComponent(q)}`);
 let d=await res.json();
 document.getElementById('results').innerHTML = d.results.length? d.results.map(cardHTML).join('') : 'مفيش نتائج، جرب كلمة انجليزية';
}
async function loadArtist(name){
 document.getElementById('artistResults').innerHTML='⏳ جاري تحميل أغاني '+name+'...';
 let res=await fetch(`https://api.jamendo.com/v3.0/tracks/?client_id=9f2d5c3a&format=json&limit=20&search=${encodeURIComponent(name)}`);
 let d=await res.json();
 // لو مفيش في المجاني، نجيب من iTunes كمعاينة
 if(!d.results.length){
   let r2=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(name)}&media=music&limit=10`);
   let d2=await r2.json();
   document.getElementById('artistResults').innerHTML = d2.results.map(s=>cardHTML({name:s.trackName,artist_name:s.artistName,audio:s.previewUrl,image:s.artworkUrl100})).join('');
 } else {
   document.getElementById('artistResults').innerHTML = d.results.map(cardHTML).join('');
 }
}
function toggleFav(t,btn){
 let idx=favs.findIndex(f=>f.audio==t.audio);
 if(idx>-1){ favs.splice(idx,1); btn.innerText='❤️ مفضلة'; } else { favs.push(t); btn.innerText='💔 إزالة'; alert('اتضافت للمفضلة ❤️'); }
 localStorage.setItem('mymusic_fav',JSON.stringify(favs)); updateFavCount();
}
function renderFav(){
 document.getElementById('favList').innerHTML = favs.length? favs.map(cardHTML).join('') : '<p style="color:#aaa">لسه مفيش مفضلة</p>';
}
async function showLyrics(artist,title,btn){
 let box=btn.parentElement.querySelector('.lyricsBox');
 box.innerHTML='⏳ جاري جلب الكلمات...';
 try{
  let r=await fetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`);
  let d=await r.json();
  if(!d.lyrics){ box.innerHTML='<div class="lyrics">كلمات الأغنية مش متاحة للأغنية دي، جرب أغنية تانية.</div>'; return; }
  let lyrics=d.lyrics.slice(0,2000);
  box.innerHTML=`<div class="lyrics">${lyrics}</div><button class="small" style="background:#ff9800" onclick="translateLyrics(this)">🌐 ترجم للعربي</button><div class="transBox"></div>`;
  box.dataset.lyrics=lyrics;
 }catch(e){ box.innerHTML='مش قادر أجيب الكلمات دلوقتي'; }
}
async function translateLyrics(btn){
 let box=btn.parentElement; let text=box.parentElement.dataset.lyrics||'';
 let transBox=box.querySelector('.transBox'); transBox.innerHTML='⏳ جاري الترجمة...';
 try{
  let r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.slice(0,500))}&langpair=en|ar`);
  let d=await r.json();
  transBox.innerHTML=`<div class="lyrics" style="direction:rtl;text-align:right">${d.responseData.translatedText}</div><small>ترجمة تقريبية بالذكاء الاصطناعي</small>`;
 }catch(e){ transBox.innerHTML='الترجمة مش شغالة دلوقتي'; }
}
document.getElementById('search').addEventListener('keypress',e=>{if(e.key=='Enter')searchMusic()});
</script>
</body>
 </html>
