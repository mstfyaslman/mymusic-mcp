name: Android translator build
on:
  push:
    paths:
      - "android-translator/**"
      - ".github/workflows/android-translator.yml"
  pull_request:
    paths:
      - "android-translator/**"
      - ".github/workflows/android-translator.yml"
concurrency:
  group: android-translator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p android-translator :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyMusic-Translator-debug
          path: android-translator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
