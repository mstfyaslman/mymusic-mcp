name: Android translator build
on:
  push:
    paths:
      - "android-translator/**"
      - ".github/workflows/android-translator.yml"
  pull_request:
    paths:
      - "android-translator/**"
      - ".github/workflows/android-translator.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p android-translator :app:assembleDebug
